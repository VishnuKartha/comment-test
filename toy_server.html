<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicoNode &mdash; The Tiny Toy Server</title>
  <meta name="description" content="A dashboard and status monitor for PicoNode, the world's tiniest toy server.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 29, 47, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-green: #10b981;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg) 75%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    .glow-orb {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15), transparent 70%);
      pointer-events: none;
      filter: blur(50px);
      z-index: 0;
    }

    .server-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(6, 182, 212, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .server-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 50px rgba(6, 182, 212, 0.12);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-green);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .led-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulseLed 2s infinite ease-in-out;
    }

    @keyframes pulseLed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .title-group h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Server Visual Mock */
    .hardware-chassis {
      background: rgba(10, 14, 26, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1.25rem;
      margin: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chassis-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pin-grid {
      display: flex;
      gap: 5px;
    }

    .pin {
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: #334155;
    }

    .pin.active {
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
    }

    .chip {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: #93c5fd;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 0.75rem;
      transition: background 0.2s;
    }

    .stat-box:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }

    .stat-val {
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: #f8fafc;
    }

    /* Interactive Section */
    .terminal-console {
      background: #05070d;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 0.75rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: #34d399;
      height: 80px;
      overflow-y: auto;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .terminal-console p {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>

  <main class="server-card" id="toyServerCard">
    <header class="header">
      <div class="title-group">
        <h1>PicoNode v0.2</h1>
        <p>Ultra-compact toy microserver</p>
      </div>
      <div class="badge" id="statusBadge">
        <span class="led-dot" id="serverLed"></span>
        <span id="statusText">ONLINE</span>
      </div>
    </header>

    <section class="hardware-chassis" aria-label="Toy Hardware Diagram">
      <div class="chassis-top">
        <div class="pin-grid">
          <div class="pin active"></div>
          <div class="pin active"></div>
          <div class="pin"></div>
          <div class="pin active"></div>
          <div class="pin"></div>
        </div>
        <span style="font-size: 0.7rem; color: #64748b; font-family: 'Fira Code', monospace;">GPIO: 3.3V &bull; 8MHz</span>
      </div>
      <div class="chip">
        <span>&mu;CPU: ATtiny85</span>
        <span style="color: #38bdf8;">RAM: 512B</span>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Uptime</div>
        <div class="stat-val" id="uptimeVal">00:00:00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Packets Served</div>
        <div class="stat-val" id="packetCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Response Time</div>
        <div class="stat-val" id="pingVal">4.2 ms</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Free Memory</div>
        <div class="stat-val" id="memVal">384 B</div>
      </div>
    </section>

    <div class="terminal-console" id="consoleLogs" aria-live="polite">
      <p>[00:00] PicoNode initialized on port 80</p>
      <p>[00:01] Listening for tiny HTTP requests...</p>
    </div>

    <footer class="controls">
      <button class="btn btn-primary" id="pingBtn" type="button">
        ⚡ Send Tiny Ping
      </button>
      <button class="btn btn-secondary" id="togglePowerBtn" type="button">
        Restart
      </button>
    </footer>
  </main>

  <script>
    const statusText = document.getElementById('statusText');
    const serverLed = document.getElementById('serverLed');
    const uptimeVal = document.getElementById('uptimeVal');
    const packetCount = document.getElementById('packetCount');
    const pingVal = document.getElementById('pingVal');
    const memVal = document.getElementById('memVal');
    const consoleLogs = document.getElementById('consoleLogs');
    const pingBtn = document.getElementById('pingBtn');
    const togglePowerBtn = document.getElementById('togglePowerBtn');

    let seconds = 0;
    let packets = 42;
    let isOnline = true;

    packetCount.textContent = packets;

    function formatTime(s) {
      const hrs = String(Math.floor(s / 3600)).padStart(2, '0');
      const mins = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const secs = String(s % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    setInterval(() => {
      if (isOnline) {
        seconds++;
        uptimeVal.textContent = formatTime(seconds);
      }
    }, 1000);

    function logMessage(msg) {
      const p = document.createElement('p');
      p.textContent = msg;
      consoleLogs.appendChild(p);
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    function playBeep(freq = 880, duration = 0.08) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    pingBtn.addEventListener('click', () => {
      if (!isOnline) {
        logMessage('⚠️ Error: Server is offline');
        playBeep(220, 0.12);
        return;
      }

      playBeep(920, 0.08);
      packets++;
      packetCount.textContent = packets;
      const latency = (Math.random() * 3 + 2).toFixed(1);
      pingVal.textContent = `${latency} ms`;
      
      const freeMem = Math.floor(340 + Math.random() * 50);
      memVal.textContent = `${freeMem} B`;

      logMessage(`GET /tiny-ping HTTP/1.0 -> 200 OK (${latency}ms)`);

      serverLed.style.transform = 'scale(1.5)';
      serverLed.style.filter = 'brightness(1.8)';
      setTimeout(() => {
        serverLed.style.transform = '';
        serverLed.style.filter = '';
      }, 150);
    });

    togglePowerBtn.addEventListener('click', () => {
      playBeep(440, 0.12);
      logMessage('🔄 Rebooting PicoNode...');
      isOnline = false;
      statusText.textContent = 'REBOOTING';
      serverLed.style.background = '#eab308';
      serverLed.style.boxShadow = '0 0 10px #eab308';

      setTimeout(() => {
        seconds = 0;
        uptimeVal.textContent = '00:00:00';
        isOnline = true;
        statusText.textContent = 'ONLINE';
        serverLed.style.background = 'var(--accent-green)';
        serverLed.style.boxShadow = '0 0 10px var(--accent-green)';
        logMessage('✨ PicoNode ready on port 80');
      }, 1200);
    });
  </script>
</body>
</html>
